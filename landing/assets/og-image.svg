    <path d="M944 288c-24-3-34 22-32 54s14 58 32 56 26-30 24-62-14-49-34-46" fill="none" stroke="#FF7A1A" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M840 300c22-18 48-20 68-2M908 298l-12-4M908 298l-2-12" fill="none" stroke="#FF7A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1024" y="278" width="110" height="60" rx="10" fill="#fff"/>
    <text x="1034" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#8E8E93">Contacto</text>
