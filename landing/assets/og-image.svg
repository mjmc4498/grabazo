    <text x="72" y="494">Gratis · Sin marca de agua · Sin límite de tiempo · Sin cuenta</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">
