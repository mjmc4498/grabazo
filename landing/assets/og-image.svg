  </g>
  <circle cx="1126" cy="447" r="2.6" fill="#E5E5EA"/>
  <rect x="1037" y="476" width="110" height="28" rx="12" fill="#1F1F22" stroke="#3A3A40" stroke-dasharray="3 3"/>
  <text x="1092" y="494" fill="#D1D1D6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700">Mantén para hablar</text>
