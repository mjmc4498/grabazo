<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Imagen para compartir (Open Graph / Twitter) de Grabazo · 1200×630 -->
  <defs>
    <radialGradient id="og-glow" cx="0.82" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FF7A1A" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FF7A1A" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF5E1A"/>
    </linearGradient>
    <linearGradient id="og-text" gradientUnits="userSpaceOnUse" x1="72" y1="0" x2="560" y2="0">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF5E1A"/>
    </linearGradient>
    <linearGradient id="og-logo-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2A2F"/>
      <stop offset="1" stop-color="#060607"/>
    </linearGradient>
    <linearGradient id="og-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF5E1A"/>
    </linearGradient>
    <clipPath id="og-win"><rect x="740" y="132" width="410" height="290" rx="18"/></clipPath>
    <clipPath id="og-cam"><circle cx="794" cy="372" r="40"/></clipPath>
    <filter id="og-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="og-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0b0b0c"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- Marca -->
  <g transform="translate(72 58) scale(0.5)">
    <rect x="2" y="2" width="124" height="124" rx="32" fill="url(#og-logo-bg)"/>
    <rect x="13" y="20" width="84" height="64" rx="12" fill="#fff"/>
    <circle cx="88" cy="88" r="32" fill="url(#og-grad)" stroke="#060607" stroke-width="7"/>
    <rect x="70" y="77" width="23" height="21" rx="5" fill="#fff"/>
    <path d="M95 84.5l10-6v19l-10-6z" fill="#fff"/>
  </g>
  <text x="148" y="106" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-1.2">Grabazo</text>

  <!-- Titular -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="56" letter-spacing="-2.2">
    <text x="70" y="218" fill="#F5F5F7">Graba tu pantalla,</text>
    <text x="70" y="284" fill="#F5F5F7">tu cámara y tus ideas.</text>
    <text x="70" y="358" fill="url(#og-text)">Tu celular es el</text>
    <text x="70" y="424" fill="url(#og-text)">control remoto.</text>
  </g>

  <!-- Beneficios -->
