  <rect x="1077" y="432" width="30" height="30" rx="9" fill="#26262A"/>
  <rect x="1111" y="432" width="30" height="30" rx="9" fill="#26262A"/>
  <path d="M1051 454l1.5-4.5 8-8a1.8 1.8 0 0 1 2.5 2.5l-8 8z" fill="none" stroke="#170A02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke="#E5E5EA" stroke-width="2" stroke-linecap="round">
    <circle cx="1091" cy="446" r="5.5"/>
    <path d="M1098 453l-3-3"/>
