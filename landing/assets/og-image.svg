    <text x="1092" y="318" fill="#F5F5F7" font-size="32" font-weight="700" letter-spacing="-1">02:14</text>
    <text x="1092" y="336" fill="#FF6B61" font-size="11" font-weight="700">Grabando</text>
  </g>
  <circle cx="1092" cy="384" r="33" fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="5"/>
  <circle cx="1092" cy="384" r="26" fill="#FF3B30"/>
  <rect x="1083" y="375" width="18" height="18" rx="4" fill="#fff"/>
