    <rect x="762" y="220" width="112" height="46" rx="9" fill="#fff"/>
    <rect x="884" y="220" width="112" height="46" rx="9" fill="#fff"/>
    <rect x="1006" y="220" width="112" height="46" rx="9" fill="#fff"/>
