  <circle cx="870" cy="397" r="5.5" fill="#FF3B30"/>
  <text x="882" y="402" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">02:14</text>
  <g fill="none" stroke="#E5E5EA" stroke-width="2" stroke-linecap="round">
    <path d="M934 391v12M940 391v12"/>
    <path d="M966 403l2-6 10-10a2.2 2.2 0 0 1 3 3l-10 10z" stroke="#FF9A4D"/>
